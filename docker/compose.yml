# AideTalk 셀프호스팅 docker compose 초안 (docs/11_ROADMAP.md M0).
#
# 기준: `docker compose -f docker/compose.yml up -d`로
#       postgres + redis + server(/healthz 200) + dashboard가 기동한다.
#
# 환경변수 단일 출처: docs/10_DEPLOYMENT.md §1 표.
# 사용법: `cp docker/.env.example docker/.env` 후 값 채우고
#         `docker compose -f docker/compose.yml up -d` (compose가 같은 디렉토리의 .env를 자동 로드).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aidetalk
      POSTGRES_USER: aidetalk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidetalk"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aidetalk]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aidetalk]

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # DB/PubSub: compose 내부 서비스명으로 접속 문자열 구성.
      DATABASE_URL: postgres://aidetalk:${DB_PASSWORD}@postgres:5432/aidetalk
      REDIS_URL: redis://redis:6379
      PUBSUB_DRIVER: ${PUBSUB_DRIVER:-redis}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/data/files}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      SERVER_URL: ${SERVER_URL}
      DASHBOARD_URL: ${DASHBOARD_URL}
      PORT: 4000
      VISITOR_TOKEN_SECRET: ${VISITOR_TOKEN_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SECRET_ENC_KEY: ${SECRET_ENC_KEY:-}
      EDITION: ${EDITION:-}
      ALLOW_INSECURE_AGENT_ENDPOINT: ${ALLOW_INSECURE_AGENT_ENDPOINT:-false}
      SMTP_URL: ${SMTP_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-https://telemetry.aidetalk.invalid/v1/ping}
    ports:
      - "4000:4000"
    volumes:
      - files:/data/files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [aidetalk]
    # 마이그레이션: 서버는 RUN_MIGRATIONS_ON_BOOT=true 환경변수로 부팅 시 자동 마이그레이션을
    # 지원한다(apps/server/src/index.ts, docs/10_DEPLOYMENT.md §2). 기본값은 false이고 이 compose
    # 파일도 명시적으로 켜지 않으므로, 최초 기동 전/후 `pnpm db:migrate`를 수동 실행하거나
    # .env에 RUN_MIGRATIONS_ON_BOOT=true를 설정해 자동화한다.

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SERVER_URL: ${SERVER_URL}
      PORT: 3000
    ports:
      - "3000:3000"
    networks: [aidetalk]

volumes:
  pgdata: {}
  files: {}

networks:
  aidetalk: {}
