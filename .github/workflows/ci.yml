# CI — lint + typecheck + vitest
#
# docs/12_GIT_STRATEGY.md §4 branch protection에서 필수 status check로
# `ci`(워크플로명/잡명 동일)를 참조하므로, 이 이름은 함부로 바꾸지 않는다.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

# 같은 브랜치에서 새 커밋이 push되면 이전 실행은 취소한다 (러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 브랜치 보호 규칙의 필수 status check 이름과 맞추기 위해 잡 이름도 `ci`로 둔다.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # actions/setup-node의 cache: pnpm 옵션이 동작하려면 pnpm CLI가 먼저 있어야 한다.
      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 9.2.0

      - name: Node.js 설치 (.nvmrc 기준, pnpm 캐시 사용)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 의존성 설치 (lockfile 고정)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      # 위젯 번들 예산 게이트 (CLAUDE.md 규칙 3: 본체 50KB / 로더 2KB gzipped).
      # 초과 시 size-limit이 비정상 종료해 머지가 차단된다.
      - name: 위젯 빌드 + 번들 예산(size-limit)
        run: pnpm --filter @aidetalk/widget build && pnpm --filter @aidetalk/widget size
