name: 기능 제안 (Feature Request)
description: 새 기능이나 개선 아이디어를 제안합니다.
title: "[Feature] "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        기능 제안 감사합니다. 제안이 PRD의 방향과 맞는지 먼저 확인해 주세요.

        > **⚠️ 현재 범위 밖(Non-goals)으로 명시된 항목입니다 — PRD 변경 없이는
        > 채택되지 않습니다:**
        > - 카카오톡/네이버 채널 연동 (인바운드 채널 확장)
        > - 마케팅 메시지 발송 (알림톡 등 브로드캐스트성 발송)
        > - 전화(음성) 기능
        >
        > 위 항목에 대한 제안은 "왜 지금 범위에 넣어야 하는가"에 대한 강한 근거
        > (예: 다수 고객의 반복 요청, 명확한 데이터)가 없다면 closed로 처리될 수
        > 있습니다. 그래도 의견이 있다면 Issue보다는 **Discussions**에서 먼저
        > 논의해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: |
        기능 자체보다 "어떤 상황에서 어떤 불편을 겪는지"를 먼저 설명해 주세요.
        (예: "상담원이 A를 하려는데 현재는 B밖에 안 되어서 C가 불편하다")
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 구체적인 UI/API/동작 방식 아이디어가 있다면 적어주세요. 없어도 괜찮습니다.

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      multiple: true
      options:
        - 위젯 (chat UI)
        - 대시보드 (인박스/설정)
        - Agent 커넥터 / 프로토콜
        - 전환 트래킹
        - 실시간 어시스트
        - 셀프호스팅 배포
        - 클라우드/과금
        - 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안으로 고려한 것
      description: 이 기능 없이 지금 어떻게 우회하고 있는지, 다른 도구는 어떻게 하는지.

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 기존 Issue/Discussion 중 유사한 제안이 없는지 검색했습니다.
          required: true
        - label: 이 제안이 PRD Non-goals(카카오/네이버 연동, 마케팅 발송, 전화 기능)에
            해당하지 않거나, 해당한다면 그럴 만한 근거를 위에 적었습니다.
          required: true
